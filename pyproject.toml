[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repeatviewer"
version = "1.1.0"
description = "RepeatViewer: PySide6 desktop app for TE curation, annotation, and visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jiangzhao Qian" },
]
dependencies = [
  "PySide6>=6.6",
  "PySide6-Addons>=6.6",
  "click>=8.0",
  "biopython>=1.80",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "plotly>=5.0",
  "requests>=2.28",
  # Forked Flexidot (Jiangzhao branch) with html output + --teviewer-integration
  # (interactive Go-to dotplots). Stock PyPI flexidot only supports png/pdf/svg.
  "flexidot @ git+https://github.com/qjiangzhao/flexidot.git@Jiangzhao",
  "pytrf>=1.4",
  "scikit-learn>=1.3",
  # ORF detection (auto annotation / protein similarity) and HMM search (Dfam, etc.)
  "orfipy>=0.0.4",
  "pyahocorasick>=2.0",
  "pyhmmer>=0.10",
  # Tools > Primers: Tm, hairpins, dimers and primer design (Primer3)
  "primer3-py>=2.0",
  # Cytogenetics: 16-bit channel TIFFs and their pixel size
  "tifffile>=2023.1",
  # Cytogenetics: LZW and other compressed TIFFs from microscope software
  "imagecodecs>=2023.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Flat Fusion theme (not default). Enable with: REPEATVIEWER_USE_QDARKTHEME=1
theme-flat = ["pyqtdarktheme-fork>=2.3.2"]

[project.scripts]
repeatviewer = "repeatviewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repeatviewer*"]

[tool.setuptools.package-data]
repeatviewer = ["backends/blast/*", "backends/mafft/**/*", "backends/muscle/**/*", "backends/iqtree/**/*", "backends/minimap2/**/*", "backends/aliview/*", "assets/icons/*", "assets/icons/**/*", "assets/manuals/*", "assets/*.png", "database/*"]
