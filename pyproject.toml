[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teviewer"
version = "0.2.0"
description = "PySide6 GUI for TE consensus curation and visualization"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
  { name = "TEtrimmer / TEviewer contributors" },
]
dependencies = [
  "PySide6>=6.6",
  "PySide6-Addons>=6.6",
  "click>=8.0",
  "biopython>=1.80",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "plotly>=5.0",
  "requests>=2.28",
  "flexidot>=2.0",
  "pytrf>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
teviewer = "teviewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["teviewer*"]

[tool.setuptools.package-data]
teviewer = ["backends/blast/*", "backends/aliview/*", "assets/icons/*", "backends/inco/*"]
