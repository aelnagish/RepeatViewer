[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teviewer-sequence-stats"
version = "0.1.0"
description = "Example TEviewer plugin — sequence length report"
requires-python = ">=3.10"
dependencies = ["teviewer>=0.2.0", "biopython>=1.80"]

[project.entry-points."teviewer.plugins"]
sequence_stats = "teviewer_sequence_stats.plugin:SequenceStatsPlugin"

[tool.setuptools.packages.find]
where = ["src"]
