[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teviewer-minimap2"
version = "0.1.0"
description = "TEviewer plugin — map FASTA to reference with minimap2"
requires-python = ">=3.10"
dependencies = ["teviewer>=0.2.0"]

[project.entry-points."teviewer.plugins"]
minimap2 = "teviewer_minimap2.plugin:Minimap2Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teviewer_minimap2 = ["binaries/**/*"]
