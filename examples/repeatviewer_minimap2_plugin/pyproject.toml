[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repeatviewer-minimap2"
version = "0.1.0"
description = "RepeatViewer plugin — map FASTA to reference with minimap2"
requires-python = ">=3.10"
dependencies = ["repeatviewer>=0.2.0"]

[project.entry-points."repeatviewer.plugins"]
minimap2 = "repeatviewer_minimap2.plugin:Minimap2Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repeatviewer_minimap2 = ["binaries/**/*"]
